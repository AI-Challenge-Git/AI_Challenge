services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mts_sos}
      POSTGRES_USER: ${POSTGRES_USER:-mts_sos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mts_sos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mts_sos}:${POSTGRES_PASSWORD:-mts_sos}@db:5432/${POSTGRES_DB:-mts_sos}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173"]}'
      ACTIVE_POLICY_VERSION: ${ACTIVE_POLICY_VERSION:-kb-trading-failure-guidance-2026-08-18}
      PII_POLICY_VERSION: ${PII_POLICY_VERSION:-pii-mask.v1}
      AI_ADAPTER: ${AI_ADAPTER:-fake}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
      AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-4}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SIGNAL_EMBEDDING_MODEL_REVISION: ${SIGNAL_EMBEDDING_MODEL_REVISION:-}
      KRX_LISTED_INFO_API_URL: ${KRX_LISTED_INFO_API_URL:-https://apis.data.go.kr/1160100/service/GetKrxListedInfoService/getItemInfo}
      KRX_LISTED_INFO_API_KEY: ${KRX_LISTED_INFO_API_KEY:-}
      ATTACHMENT_STORAGE_BACKEND: ${ATTACHMENT_STORAGE_BACKEND:-local}
      ATTACHMENT_STORAGE_DIR: /app/data/attachments
      ATTACHMENT_SIGNED_URL_TTL_SECONDS: ${ATTACHMENT_SIGNED_URL_TTL_SECONDS:-300}
      BUCKET: ${BUCKET:-}
      ACCESS_KEY_ID: ${ACCESS_KEY_ID:-}
      SECRET_ACCESS_KEY: ${SECRET_ACCESS_KEY:-}
      REGION: ${REGION:-}
      ENDPOINT: ${ENDPOINT:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-virtual}
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY:-development-session-hmac-key-change-me}
      REFERENCE_HMAC_KEY: ${REFERENCE_HMAC_KEY:-development-reference-hmac-key-change-me}
      AGENT_TOKEN_HMAC_KEY: ${AGENT_TOKEN_HMAC_KEY:-development-agent-token-hmac-key-change-me}
      RATE_LIMIT_HMAC_KEY: ${RATE_LIMIT_HMAC_KEY:-development-rate-limit-hmac-key-change-me}
      AGENT_ACCESS_TOKEN_TTL_MINUTES: ${AGENT_ACCESS_TOKEN_TTL_MINUTES:-30}
      AGENT_LOGIN_FAILURE_LIMIT: ${AGENT_LOGIN_FAILURE_LIMIT:-5}
      AGENT_LOGIN_FAILURE_WINDOW_SECONDS: ${AGENT_LOGIN_FAILURE_WINDOW_SECONDS:-300}
      AGENT_LOGIN_FAILURE_DELAY_MS: ${AGENT_LOGIN_FAILURE_DELAY_MS:-300}
      AGENT_LOOKUP_LIMIT: ${AGENT_LOOKUP_LIMIT:-10}
      AGENT_LOOKUP_WINDOW_SECONDS: ${AGENT_LOOKUP_WINDOW_SECONDS:-60}
      AGENT_LOOKUP_FAILURE_DELAY_MS: ${AGENT_LOOKUP_FAILURE_DELAY_MS:-250}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - attachment_data:/app/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  attachment_data:
